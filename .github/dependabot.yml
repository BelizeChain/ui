# Dependabot configuration for the BelizeChain UI.
#
# Why this file exists: security *alerts* are generated by GitHub automatically and
# never needed this file. What was missing was the scheduled version-update PRs.
#
# The github-actions entry specifically fixes a measured problem. Across the
# BelizeChain repos, action refs drifted apart because only some repos had this
# entry: the repos that had it sit at current versions (checkout v7, cache v6,
# upload-artifact v7, codecov v7), while the repos without it were left behind at
# v4/v5. Nothing was tracking the difference. This file makes the repo self-healing.
#
# Deliberately NOT configured yet: the npm ecosystem. The UI is a Turborepo with a
# large tree, so enabling npm here would open a substantial stream of PRs and is a
# volume decision for a maintainer, not a bug fix. Say the word and it is one entry.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
